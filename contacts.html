<h2>Order your cookies</h2>

<!--Order form-->
 
<form>

</div>

<a href="thankyou.html" class="btn btn-primary">Submit</a>
</button>

<br><br>
<!--radio button-->
<form>
  

  <div>
    <label>
      <input type="radio" name="deliveryOption" value="pickup">

    </label>
    <label>
      <input type="radio" name="deliveryOption" value="delivery">

    </label>
  </div>
</form>

<br><br>

<!--Drop down options-->
<label for="pickTime">Select pick time:</label>
<select id="pickTime" name="pickTime">
  <option value="morning">0800-1100hrs</option>
  <option value="afternoon">1200-1500hrs</option>
  <option value="evening">1600-1900hrs</option>
</select>

<label for="pickDate">Select pick date:</label>
<select id="pickDate" name="pickDate">
  <option value="Monday">Monday</option>
  <option value="Tuesday">Tuesday</option>
  <option value="Wednesday">Wednesday</option>
  <option value="Thursday">Thursday</option>
  <option value="Friday">Friday</option>
</select>
