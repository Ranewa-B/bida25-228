<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #e3f6f9; /* pastel background */
      margin: 0;
      padding: 50px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }
    
    /* Thank You box */
    .thank-you {
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      animation: fadeIn 1s ease;
    }
    h1 {
      font-family: 'Pacifico', cursive;
      color: #3a7c91;
    }
    p {
      font-style: italic; /* inline requirement shown here */
      color: #333;
    }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #3a7c91;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      transition: background 0.3s ease;
    }
    a.button:hover {
      background: #2a5d6e;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
   
    <!-- Thank You Box -->
    <div class="thank-you">
      <h1>Thank You!</h1>
      <p style="font-style: italic;">Your order has been received and is being processed.</p>
      <a href="index.html" class="button">Return to Home</a>
    </div>
  </div>
</body>
</html>
